# SETUPMODEL-1: the Lotus 49 GARAGE -- reference's setup knobs and the constants of the static model that turns them into
# reference's derived numbers. ONE source for both front ends: JuliaMotorMTK/src/garage.jl (the physics) and
# demo/native/garage.py (the launcher's Garage tab) read this file; tools/garage_smoke.jl checks they agree.
#
# [params] were identified by tools/garage_fit_261017.jl (--emit) from the PO's 261017 garage screenshots and every
# CarSetup in the gold .ibt store (261017/garage/frames_*.csv). Fit quality on the trusted frames: base car, fuel
# 4.5-179.5 L, front springs 18/30/35 N/mm and +-2 mm perch twists within 0.5 mm / 5 N; perch extremes (spring loose,
# car on the bump rubber) 3-6 mm / 10-25 N; asymmetric-camber setups (WW103, June skidpad) 1.5-3.5 mm / 15-40 N.

[params]
L = [149.157, 88.6348]            # spring compression [mm] = (s0 - perch + L) + MRk * wheel travel
MR = [0.814256, 0.693304]         # shock travel per wheel travel
MRq = [0.0, 0.0]
MRk = [0.809881, 0.668786]        # spring travel per wheel travel (front coil-over: = MR)
bar_shown = 1.0
rh_mix = [0.0159551, 0.000744332] # ride-height point sits this far toward the other axle (fraction of the wheelbase)
s0 = [61.3077, 59.1718]           # shock deflection at the reference [mm]
R0 = [87.008, 114.448]            # ride height at the reference, unloaded tyre [mm]
unsprung = [225.952, 225.843]     # N per corner
kt = [362.393, 168.749]           # tyre vertical rate [N/mm] at 152 kPa
kt_p = -0.00107309
rp = [-0.0350197, 0.0288892]
karb = [13.2411, 18.8832]         # bar rate at the wheel, base diameter + arm [N/mm]
arm_beta = [0.0791486, 0.0907786] # RARBARMS-1 S3 (2026-10-25): refit with the PO's 19 IRPLAN-4 B3 twist sheets (every
                                  # hole, both bars; karb + beta only, GF_INIT=shipped, GF_DROP=spring_perch_low): a hole
                                  # moved the corner weights ~2x too much at 0.150. 261024 sheets 6.84 -> 5.91 digits,
                                  # the earlier frames 6.86 -> 6.90. The sim's own bar laws (drive_rt3d ARB_LAW_*) unchanged.
kbump = [328.012, 190.027]
bump_gap = [18.4645, 14.0535]
trackratio = 0.989648
track_f = 1530.0
scrub = [0.0, 0.0]
cam_patch = 14.0976                # IRDATA-261018 S1 refit of the camber terms only, with the 261018 setup sheets
cam_jack = 1.5132                  # mm of effective wheel length per deg of camber knob (camber jacks the corner)
cam_jack2 = 0.0024
cam_ref = [-0.4, -0.5]
W0 = 5617.92                      # weight with an empty tank [N]
front0 = 0.438952
fuel_kgL = 0.750876
fuel_front = 0.659651
cam_gain = [0.0258845, 0.0238293] # deg of camber per mm of wheel travel (compression -> negative)
cam_roll = [-1.30643, -1.12973]
toe_gain = 0.016                  # front toe-in [mm] per mm of summed front wheel travel (droop -> toe-out)
rpm_r = 3144.95                   # rev limit x rolling radius [rpm*m]: gear km/h = rpm_r*2pi/60/(ratio*final)*3.6 (every
                                  # gear speed reference showed at finals 3.78/4.11/4.22, all 15 to the digit)

# ---- the knobs, as reference's garage shows them ---------------------------------------------------------------------
