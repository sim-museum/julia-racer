# ---- STEER16 (PO 2026-10-25): julia's own changes on top of a recorded session ----------------------------------------
# Knobs julia sets differently from the .ibt session a setup is built from -- the launcher's base for that setup (via
# tools/garage_sessions.jl) and the sim's car (drive_native_mtk.jl session_params) both apply them. WW103 runs Classic's
# 16:1 steering: reference's Lotus offers 16:1 (IRPLAN-4 B2), the 261005 WW103 session was driven at 10:1.
[julia_setup.ww103]
steering_ratio = 16.0

# ---- CLASSICSETUP-1: what a typical Classic Lotus 49 setup is (medians over the 6,025 .kj1 on the PO's PC, 2026-10-17) -------
# The importer (demo/native/classic_setup.py) carries a Classic anti-roll bar over by its range position: Classic rate / this median
# -> the reference bar whose garage rate stands the same way against the default car's.
[classic]
arb_median = [160.0, 150.0]       # lb/in, front / rear (min 60/40, max 280/292)
wheel_rate_median = [75.0, 95.0]  # lb/in (front 50..125, rear 70..160) -- for reference
