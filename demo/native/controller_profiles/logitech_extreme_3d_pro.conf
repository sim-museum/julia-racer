# juliaRacer built-in controller profile (CTRLCAL-1). One source for the sim (JoyCfg) and the launcher.
# Logitech Extreme 3D Pro joystick: steer = roll (axis 1), throttle/brake = push/pull on axis 2, clutch = the
# throttle slider (axis 4, ridable -- PO 2026-08-27), trigger = up (1), thumb = down (2), button 3 = clutch.
label Logitech Extreme 3D Pro
match extreme 3d
steer.axis 1
steer.a -1.0
steer.b 1.0
throttle.axis 2
throttle.a 0.0
throttle.b -1.0
brake.axis 2
brake.a 0.0
brake.b 1.0
clutch.axis 4
clutch.a -1.0
clutch.b 1.0
up_btn 1
dn_btn 2
clutch_btn 3
deadzone 0.06
