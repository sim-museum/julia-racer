# juliaRacer built-in controller profile (CTRLCAL-1). One source for the sim (JoyCfg) and the launcher.
# Thrustmaster TX (hid-tmff2): wheel axis 1, throttle 2, clutch 3, brake 4 -- each pedal rests at +1.0 and
# falls when pressed; paddles: right (button 2) = up, left (button 1) = down. Values are the PO's own
# calibration of this wheel (juliaRacer.py, 2026-06-29). The wheel steers by its real angle (JoyCfg.steer_physical);
# its endpoints here only give the centre and the direction.
label Thrustmaster TX
match thrustmaster tx
steer.axis 1
steer.a -0.99701
steer.b 0.99637
throttle.axis 2
throttle.a 1.0
throttle.b -0.99804
brake.axis 4
brake.a 1.0
brake.b 0.29814
clutch.axis 3
clutch.a 0.99609
clutch.b -0.99609
up_btn 2
dn_btn 1
clutch_btn 0
deadzone 0.06
